AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Static website for Isaac Hasbani's CV with CloudFront HTTPS and custom domain

Parameters:
  Environment:
    Type: String
    Default: Production
    Description: Environment name
  Project:
    Type: String
    Default: "CV-Challenge"
    Description: Project name for resource tagging
  Owner:
    Type: String
    Default: "Isaac-Hasbani"
    Description: Resource owner
  CostCenter:
    Type: String
    Default: "Personal"
    Description: Cost center for billing
  DomainName:
    Type: String
    Default: "www.isaachasbani.com"
    Description: Custom domain name for the website
  CertificateArn:
    Type: String
    Default: "arn:aws:acm:us-east-1:825765413106:certificate/f4712791-9118-4c00-88bb-4d4d8dd4e6b9"
    Description: SSL Certificate ARN (must be in us-east-1 for CloudFront)

Resources:
  # Route 53 Hosted Zone for the domain
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "Hosted zone for ${DomainName}"
      HostedZoneTags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: Purpose
          Value: "Portfolio-Website"
        - Key: DeployedBy
          Value: "SAM"
        - Key: Component
          Value: "DNS"

  # S3 Bucket (no longer needs website configuration)
  CVWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      # Add tags to S3 bucket
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: Purpose
          Value: "Portfolio-Website"
        - Key: DeployedBy
          Value: "SAM"
        - Key: Component
          Value: "Frontend"
        - Key: ResourceType
          Value: "Storage"

  # Origin Access Control for secure CloudFront access
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution with HTTPS and custom domain
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        # Custom domain aliases
        Aliases:
          - !Ref DomainName
        
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt CVWebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # AWS Managed CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # AWS Managed CORS-S3Origin
        
        Enabled: true
        DefaultRootObject: index.html
        
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
        
        # Custom SSL certificate configuration
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        
        PriceClass: PriceClass_100
        IPV6Enabled: true
      # Add tags to CloudFront distribution
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: Purpose
          Value: "Portfolio-Website"
        - Key: DeployedBy
          Value: "SAM"
        - Key: Component
          Value: "Frontend"
        - Key: ResourceType
          Value: "CDN"

  # DNS A record pointing to CloudFront
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (fixed value)
        EvaluateTargetHealth: false

  # DNS AAAA record for IPv6 support
  DNSRecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (fixed value)
        EvaluateTargetHealth: false

  # Update bucket policy to only allow CloudFront access
  CVWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CVWebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "${CVWebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

Outputs:
  CVWebsiteBucket:
    Description: Name of the S3 bucket for the CV website
    Value: !Ref CVWebsiteBucket
    Export:
      Name: !Sub "${AWS::StackName}-CVWebsiteBucket"
  
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"
  
  WebsiteURL:
    Description: HTTPS URL of the CV website via CloudFront
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-WebsiteURL"
  
  CustomDomainURL:
    Description: Custom domain URL for the CV website
    Value: !Sub "https://${DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-CustomDomainURL"
  
  CloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt CloudFrontDistribution.DomainName

  HostedZoneId:
    Description: Route 53 Hosted Zone ID
    Value: !Ref HostedZone
    Export:
      Name: !Sub "${AWS::StackName}-HostedZoneId"

  NameServers:
    Description: Name servers for the hosted zone
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
    Export:
      Name: !Sub "${AWS::StackName}-NameServers"
